<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1633"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Rings -->
  <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="16 10" transform="rotate(-25 256 256)" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="220" ry="95" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(35 256 256)" opacity="0.4"/>

  <!-- Satellite in Orbit -->
  <circle cx="430" cy="190" r="10" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Helmet Outer Shell -->
  <circle cx="256" cy="256" r="140" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Visor -->
  <path d="M 176 220 Q 256 195 336 220 Q 350 280 326 315 Q 256 345 186 315 Q 162 280 176 220 Z" fill="url(#visorGrad)"/>

  <!-- Visor Specular Reflection -->
  <path d="M 195 230 Q 240 215 295 230 Q 260 255 205 255 Z" fill="#ffffff" opacity="0.45"/>

  <!-- Bangladesh Flag Roundel Emblem on Helmet -->
  <circle cx="256" cy="365" r="18" fill="#006a4e"/>
  <circle cx="252" cy="365" r="8" fill="#f42a41"/>

  <!-- Junior Astronaut Star Badge -->
  <polygon points="256,135 262,152 280,152 265,163 271,180 256,169 241,180 247,163 232,152 250,152" fill="#facc15" filter="url(#glow)"/>
</svg>
